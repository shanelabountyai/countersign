<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signing link notices (410, 404, 429)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#EFEFEA}
a{color:#0F5E63}a:hover{color:#0A4347}
</style>
</helmet>
<!-- Gap design (2026-11-18): every other answer a signing link can give, in the look of Superseded.dc.html.
     410 reasons come from GoneReason in src/lib/proposal/signing.ts (D-13, D-36); 404 unknown link; 429 rate limit.
     Each notice is word + glyph + colour. Use the buttons to switch. -->
<div style="min-height: 100%; background: #EFEFEA; color: #16181D; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5;">
<main style="max-width: 640px; margin: 0 auto; padding: 48px 24px 72px; display: flex; flex-direction: column; gap: 20px;">
<div role="group" aria-label="Preview a notice" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #8A8F99; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 14px; font-weight: 600;">{{t.label}}</button>
</sc-for>
</div>
<sc-if value="{{hasOrg}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 10px;">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #16181D; color: #7FD1CF; display: inline-flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700;">[I]</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px;">[ORG NAME]</span>
</div>
</sc-if>
<section style="background: #FFFFFF; border: 1px solid #D9D9D2; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px;">
<span style="align-self: flex-start; display: inline-flex; gap: 6px; background: {{n.bg}}; color: {{n.fg}}; border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 14px;"><span aria-hidden="true">{{n.g}}</span>{{n.word}}</span>
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.25;">{{n.h}}</h1>
<p style="margin: 0; color: #3E434D;">{{n.p}}</p>
</section>
<p style="margin: 0; font-size: 13px; color: #565B66;">Demo: not a legally vetted e-signature product.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":700}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { k: 'declined' }; }
  renderVals() {
    const amber = { bg: '#FBF0DA', fg: '#6B4100' }, red = { bg: '#FBE9E7', fg: '#8A1F11' }, grey = { bg: '#EEEEEA', fg: '#3E434D' };
    const N = {
      declined: { ...red, g: '✗', word: 'Declined', h: '[PROPOSAL TITLE] was declined.', p: 'Nothing was signed, and this link no longer works. If that was a mistake, contact [ORG NAME] and ask for a new version.' },
      expired: { ...amber, g: '⌛', word: 'Link expired', h: 'This signing link for [PROPOSAL TITLE] has expired.', p: 'Nothing was signed on it. Ask [ORG NAME] for a new link.' },
      revoked: { ...amber, g: '↻', word: 'Link replaced', h: '[ORG NAME] replaced this signing link with a newer one.', p: 'The proposal itself has not changed. Use the newest link you were sent, or ask [ORG NAME] to send it again.' },
      closed: { ...grey, g: '■', word: 'Closed', h: 'This proposal is closed.', p: 'The link no longer works. Contact the sender if you expected to sign it.' },
      notfound: { ...grey, g: '?', word: 'Link not found', h: 'We could not find this signing link.', p: 'Check that you copied the whole link from the message you were sent.' },
      limited: { ...amber, g: '⏸', word: 'Too many requests', h: 'Too many requests from your network.', p: 'Wait a few minutes, then reload this page.' }
    };
    const order = [['declined', '410 declined'], ['expired', '410 expired'], ['revoked', '410 replaced link'], ['closed', '410 closed'], ['notfound', '404'], ['limited', '429']];
    const k = this.state.k;
    return {
      n: N[k],
      hasOrg: k !== 'notfound' && k !== 'limited' && k !== 'closed',
      tabs: order.map(([key, label]) => ({ label, on: key === k, bg: key === k ? '#16181D' : '#FFFFFF', fg: key === k ? '#FFFFFF' : '#16181D', pick: () => this.setState({ k: key }) }))
    };
  }
}
</script>
</body>
</html>
